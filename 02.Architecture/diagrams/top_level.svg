<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-irq" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B23B3B"/>
    </marker>
  </defs>

  <rect width="1120" height="640" fill="#FFFFFF"/>

  <rect x="20" y="20" width="1080" height="520" rx="10" fill="#FAFAFA" stroke="#555" stroke-width="1.5"/>
  <text x="40" y="48" font-size="18" font-weight="bold" fill="#222">soc_top</text>
  <text x="40" y="70" font-size="13" fill="#555">parâmetros: ARRAY_SIZE (N) ∈ {2, 4, 8} · DATA_WIDTH ∈ {8, 16, 32} · clock clk_i · reset rst_ni (ativo em 0)</text>

  <g text-anchor="middle">
    <rect x="40" y="110" width="150" height="100" rx="6" fill="#E8EEF7" stroke="#3B5B8C" stroke-width="1.5"/>
    <text x="115" y="140" font-size="14" font-weight="bold" fill="#1F3557">Memória de</text>
    <text x="115" y="158" font-size="14" font-weight="bold" fill="#1F3557">instruções</text>
    <text x="115" y="178" font-size="12" fill="#333">4 KiB</text>
    <text x="115" y="196" font-size="11" fill="#555">0x0000_0000</text>

    <rect x="260" y="100" width="140" height="140" rx="6" fill="#FDF1E3" stroke="#B5651D" stroke-width="1.5"/>
    <text x="330" y="160" font-size="16" font-weight="bold" fill="#6B3A0F">CPU</text>
    <text x="330" y="180" font-size="13" fill="#333">RV32I</text>

    <rect x="260" y="340" width="140" height="150" rx="6" fill="#E7F4EA" stroke="#2E7D4F" stroke-width="1.5"/>
    <text x="330" y="398" font-size="16" font-weight="bold" fill="#1B4D30">DMA</text>
    <text x="330" y="420" font-size="11" fill="#333">registradores</text>
    <text x="330" y="436" font-size="11" fill="#333">+ controle do tiling</text>

    <rect x="490" y="100" width="170" height="410" rx="6" fill="#E8EEF7" stroke="#3B5B8C" stroke-width="1.5"/>
    <text x="575" y="270" font-size="15" font-weight="bold" fill="#1F3557">Interconexão</text>
    <text x="575" y="290" font-size="15" font-weight="bold" fill="#1F3557">AXI4-Lite</text>
    <text x="575" y="314" font-size="11" fill="#333">árbitro round-robin</text>
    <text x="575" y="330" font-size="11" fill="#333">entre CPU e DMA</text>
    <text x="575" y="350" font-size="11" fill="#333">+ decodificador</text>
    <text x="575" y="366" font-size="11" fill="#333">de endereços</text>

    <rect x="740" y="100" width="170" height="110" rx="6" fill="#E8EEF7" stroke="#3B5B8C" stroke-width="1.5"/>
    <text x="825" y="140" font-size="14" font-weight="bold" fill="#1F3557">Memória de dados</text>
    <text x="825" y="160" font-size="12" fill="#333">16 KiB, uma porta</text>
    <text x="825" y="178" font-size="11" fill="#333">matrizes A, B e C</text>
    <text x="825" y="196" font-size="11" fill="#333">+ dados do firmware</text>

    <rect x="740" y="300" width="140" height="100" rx="6" fill="#E8EEF7" stroke="#3B5B8C" stroke-width="1.5"/>
    <text x="810" y="340" font-size="14" font-weight="bold" fill="#1F3557">Adaptador</text>
    <text x="810" y="358" font-size="14" font-weight="bold" fill="#1F3557">do acelerador</text>
    <text x="810" y="378" font-size="11" fill="#333">AXI4-Lite → casca</text>
    <text x="810" y="393" font-size="11" fill="#333">guarda CTRL</text>

    <rect x="930" y="270" width="150" height="190" rx="6" fill="#F1E9F7" stroke="#6B3FA0" stroke-width="1.5"/>
    <text x="1005" y="302" font-size="15" font-weight="bold" fill="#43246B">Acelerador</text>
    <text x="1005" y="324" font-size="11" fill="#333">STATUS</text>
    <rect x="950" y="336" width="110" height="26" rx="3" fill="#FFFFFF" stroke="#6B3FA0"/>
    <text x="1005" y="353" font-size="11" fill="#333">buffer DATA_IN</text>
    <rect x="950" y="370" width="110" height="34" rx="3" fill="#FFFFFF" stroke="#6B3FA0"/>
    <text x="1005" y="385" font-size="11" fill="#333">malha N × N</text>
    <text x="1005" y="398" font-size="10" fill="#555">weight-stationary</text>
    <rect x="950" y="412" width="110" height="26" rx="3" fill="#FFFFFF" stroke="#6B3FA0"/>
    <text x="1005" y="429" font-size="11" fill="#333">buffer DATA_OUT</text>
  </g>

  <g stroke="#333" stroke-width="1.6" fill="none">
    <line x1="260" y1="160" x2="190" y2="160" marker-end="url(#arrow)"/>
    <line x1="400" y1="200" x2="490" y2="200" marker-end="url(#arrow)"/>
    <line x1="400" y1="370" x2="490" y2="370" marker-end="url(#arrow)"/>
    <line x1="490" y1="460" x2="400" y2="460" marker-end="url(#arrow)"/>
    <line x1="660" y1="155" x2="740" y2="155" marker-end="url(#arrow)"/>
    <line x1="660" y1="350" x2="740" y2="350" marker-end="url(#arrow)"/>
    <line x1="880" y1="350" x2="930" y2="350" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#B23B3B" stroke-width="1.6" fill="none" stroke-dasharray="6 4">
    <line x1="300" y1="340" x2="300" y2="240" marker-end="url(#arrow-irq)"/>
    <line x1="360" y1="490" x2="360" y2="580" marker-end="url(#arrow-irq)"/>
  </g>

  <g font-size="11" fill="#333">
    <text x="225" y="146" text-anchor="middle">instrução</text>
    <text x="445" y="182" text-anchor="middle">dados</text>
    <text x="445" y="195" text-anchor="middle" fill="#555">mestre</text>
    <text x="445" y="352" text-anchor="middle">mestre</text>
    <text x="445" y="442" text-anchor="middle">escravo</text>
    <text x="445" y="480" text-anchor="middle" fill="#555">0x2000_0000</text>
    <text x="700" y="145" text-anchor="middle" fill="#555">0x1000_0000</text>
    <text x="700" y="340" text-anchor="middle" fill="#555">0x4000_0000</text>
    <text x="292" y="295" text-anchor="end" fill="#B23B3B">interrupção</text>
    <text x="370" y="577" fill="#B23B3B">saída de interrupção</text>
  </g>
  <text x="905" y="335" font-size="10" fill="#555" text-anchor="middle">casca</text>

  <g font-size="12" fill="#333">
    <text x="560" y="588">Dono:</text>
    <rect x="600" y="578" width="12" height="12" fill="#E8EEF7" stroke="#3B5B8C"/>
    <text x="618" y="588">Sistema</text>
    <rect x="680" y="578" width="12" height="12" fill="#FDF1E3" stroke="#B5651D"/>
    <text x="698" y="588">CPU</text>
    <rect x="740" y="578" width="12" height="12" fill="#E7F4EA" stroke="#2E7D4F"/>
    <text x="758" y="588">DMA</text>
    <rect x="802" y="578" width="12" height="12" fill="#F1E9F7" stroke="#6B3FA0"/>
    <text x="820" y="588">Acelerador</text>

    <line x1="560" y1="616" x2="592" y2="616" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="600" y="620">quem inicia → quem responde (AXI4-Lite, 32 bits)</text>
    <line x1="910" y1="616" x2="942" y2="616" stroke="#B23B3B" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-irq)"/>
    <text x="950" y="620">interrupção</text>
  </g>
</svg>
